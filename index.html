<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAYKIT☆ | Coming Soon</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #731212;
      --light: #ffffff;
      --gray: #f0eaea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--primary);
      color: var(--light);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 64px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: var(--gray);
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    input[type="email"] {
      padding: 12px 15px;
      border-radius: 25px;
      border: none;
      width: 250px;
      font-size: 16px;
    }

    button {
      background: var(--light);
      color: var(--primary);
      padding: 12px 30px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #f0eaea;
    }

    #responseMessage {
      margin-top: 15px;
      color: var(--gray);
      font-weight: 500;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 16px;
      color: var(--light);
      text-align: center;
    }

    footer a {
      color: var(--light);
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
      }
      h2 {
        font-size: 18px;
      }
      input[type="email"] {
        width: 200px;
      }
    }
  </style>
</head>

<body>

  <h1>DAYKIT☆</h1>
  <h2>what your bag needs</h2>
  <p>Our website is launching soon. Enter your email to get notified!</p>

  <!-- Netlify Form -->
  <form name="notify" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <!-- Hidden field for Netlify -->
    <input type="hidden" name="form-name" value="notify">
    
    <!-- Honeypot for bots (optional) -->
    <p style="display:none;">
      <label>Don't fill this out: <input name="bot-field"></label>
    </p>
    
    <!-- Email input -->
    <input type="email" name="email" placeholder="Enter your email" required>
    
    <!-- Submit button -->
    <button type="submit">Notify Me</button>
  </form>

  <!-- Thank you message -->
  <p id="responseMessage"></p>

  <footer>
    <p>
      Contact us: 
      <a href="mailto:daykiteg@gmail.com">daykiteg@gmail.com</a> | 
      Instagram: <a href="https://www.instagram.com/daykit.eg?igsh=YjE3NXhzc284azZr" target="_blank">@daykit.eg</a>
    </p>
  </footer>

  <script>
    // Show thank-you message and clear input
    const form = document.querySelector('form[name="notify"]');
    const response = document.getElementById('responseMessage');

    form.addEventListener('submit', function(e) {
      response.textContent = "Thank you! Your email has been recorded. We’ll notify you when we launch.";
      form.reset(); // clears input
    });
  </script>

</body>
</html>
